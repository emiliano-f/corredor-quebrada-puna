# Corredor Quebrada–Puna — pipeline configuration.
# Loaded with yaml.safe_load by corredor.config.load_config. Secrets never go here:
# they come from environment variables (see corredor.config.Settings).

http:
  user_agent: "corredor-quebrada-puna/0.1 (+https://github.com/emiliano-f/corredor-quebrada-puna)"
  min_interval_s: 2.5
  timeout_s: 30
  retries: 3
  robots_ttl_h: 24
  not_found_ttl_h: 24

backfill:
  desde: 2016-01-01
  max_requests_per_run: 2000
  muestra_sitemaps: ["2017-01", "2024-02", "2026-08"]

# PROVISIONAL critical points. Coordinates looked up once on OpenStreetMap (Nominatim,
# 2026-11-13); `osm` is the matched OSM object. Nothing here is verified: Child C
# (feature/geo) verifies order, km and coordinates and sets `verificado: true`.
# km values are deliberately left empty until verified (do not trust the plan's km).
puntos:
