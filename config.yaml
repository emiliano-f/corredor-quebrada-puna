  - id: rn9_tumbaya
    nombre: "Tumbaya"
    ruta: RN9
    lat: -23.85754
    lon: -65.46701
    verificado: false
    fuente_geo: "OSM relation/4473251 (Municipio de Tumbaya)"
  - id: rn9_maimara
    nombre: "Maimará"
    ruta: RN9
    lat: -23.62450
    lon: -65.40860
    verificado: false
    fuente_geo: "OSM relation/4484386 (Municipio de Maimará)"
  - id: rn9_tilcara
