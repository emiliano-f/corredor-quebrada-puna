  - {id: viapais, nombre: "Vía País Jujuy", base_url: "https://viapais.com.ar/jujuy", metodo: sitemap, tier: 2, enabled: false}
  - {id: infobae, nombre: "Infobae", base_url: "https://www.infobae.com", metodo: sitemap, tier: 2, enabled: false}
