# Sources from the approved survey (docs/FUENTES.md). Generic outlets are added here,
# not in code. `archivo_desde` = first month with archive; `republica: true` = mostly
# republishes other outlets, so it does not count in n_medios.
# Excluded candidates are listed only in docs/FUENTES.md.
fuentes:
  # --- Tier 1, WordPress REST API ---
  - id: elsubmarino
    nombre: "El Submarino Jujuy"
    base_url: "https://elsubmarinojujuy.com.ar"
    metodo: wordpress_api
    tier: 1
    enabled: true
    archivo_desde: 2013-07-01
  - id: jujuyaldia
    nombre: "Jujuy al Día"
    base_url: "https://www.jujuyaldia.com.ar"
    metodo: wordpress_api
    tier: 1
    enabled: true
    archivo_desde: 2010-01-01
  - id: radioazultilcara
    nombre: "Radio Azul Tilcara"
    base_url: "https://radioazultilcara.com.ar"
    metodo: wordpress_api
    tier: 1
    enabled: true
    archivo_desde: 2018-12-01
    local: true
  - id: jujuyonline
    nombre: "Jujuy Online"
    base_url: "https://jujuyonline.com"
    metodo: wordpress_api
    tier: 1
    enabled: true
    archivo_desde: 2026-04-01
    republica: true
  # --- Tier 1, monthly sitemaps ---
  - id: todojujuy
    nombre: "Todo Jujuy"
    base_url: "https://www.todojujuy.com"
    metodo: sitemap
    tier: 1
    enabled: true
    archivo_desde: 2012-01-01
    params:
      sitemap_mensual: "https://www.todojujuy.com/sitemap/news-full/sitemap-{yyyymm}.xml.gz"
  - id: jujuyalmomento
    nombre: "Jujuy al Momento"
    base_url: "https://www.jujuyalmomento.com"
    metodo: sitemap
    tier: 1
    enabled: true
    archivo_desde: 2011-01-01
    params:
      sitemap_mensual: "https://www.jujuyalmomento.com/sitemap/news-full/sitemap-{yyyymm}.xml.gz"
  - id: somosjujuy
    nombre: "Somos Jujuy"
    base_url: "https://www.somosjujuy.com.ar"
    metodo: sitemap
    tier: 1
    enabled: true
    archivo_desde: 2018-01-01
    params:
      sitemap_mensual: "https://www.somosjujuy.com.ar/sitemapNoticias{yyyymm}.xml"
  - id: prensajujuy
    nombre: "Prensa Gobierno de Jujuy"
    base_url: "https://prensa.jujuy.gob.ar"
    metodo: sitemap
    tier: 1
    enabled: true
    archivo_desde: 2016-05-01
    oficial: true
    params:
      sitemap_mensual: "https://prensa.jujuy.gob.ar/sitemap/news-full/sitemap-{yyyymm}.xml.gz"
  # --- Tier 1, custom parsers (Child B); enabled once implemented ---
  - id: eltribunojujuy
    nombre: "El Tribuno de Jujuy"
    base_url: "https://www.eltribunodejujuy.com"
    metodo: custom
    tier: 1
    enabled: false
  - id: vialidadnacional
    nombre: "Vialidad Nacional — noticias"
    base_url: "https://www.argentina.gob.ar/node/96178/noticias"
    metodo: custom
    tier: 1
    enabled: false
    oficial: true
  # --- Tier 1, Paso de Jama status snapshots (Child B; GitHub Actions every 3 h) ---
  - id: jama_mop_cl
    nombre: "Vialidad MOP Chile — Pasos Fronterizos (Jama)"
    base_url: "https://rest-sit.mop.gob.cl/arcgis/rest/services/VIALIDAD/Pasos_Fronterizos/MapServer/0"
    metodo: snapshot
    tier: 1
    enabled: true
    oficial: true
    params:
      objectid: 7
  - id: jama_argentina_gob_ar
    nombre: "Pasos internacionales AR — listado (Jama)"
    base_url: "https://www.argentina.gob.ar/seguridad/pasosinternacionales/listado"
    metodo: snapshot
    tier: 1
    enabled: true
    oficial: true
    params:
      ids: [19]                    # Jama: always stored
      ids_si_cambian: [100, 101]   # Jama Norte / Sur (not open): stored only while their
      estado_base:                 # status differs from this baseline
        estado_prioridad: CERRADO
        estado_vialidad: HABILITADA
  # --- Tier 2 (backlog; one GitHub issue each, label tier-2) ---
  - {id: infotilcara, nombre: "InfoTilcara / Radio RIN", base_url: "https://infotilcara.com.ar", metodo: wordpress_api, tier: 2, enabled: false, archivo_desde: 2023-06-01, local: true}
