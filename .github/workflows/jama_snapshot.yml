name: Jama snapshot
run-name: "Jama snapshot (${{ inputs.origen || github.event_name }})"

# Every hour: `corredor snapshot-jama` appends one line per source to
# snapshots/jama_estado.jsonl on the orphan branch `data-snapshots` (never on main).
# A failing source is recorded as a line with `error`; it does not fail the run.
# Then: Telegram (only on a state change + daily summary; skipped without secrets), and the
# "Jama al Día" page is rebuilt and published to GitHub Pages.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      prueba:
        description: "Publicar un mensaje de prueba en Telegram"
        type: boolean
        default: false
      origen:
        description: "Quién dispara la corrida (p. ej. cron-job.org); solo para el nombre"
        type: string
        required: false
        default: ""

permissions: {}

concurrency:
  group: jama-snapshot
  cancel-in-progress: false

env:
  DATA_BRANCH: data-snapshots
  DATA_DIR: data-branch
  SNAPSHOT_FILE: snapshots/jama_estado.jsonl
  TELEGRAM_FILE: snapshots/telegram_estado.json

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - run: uv sync --frozen

      - name: Check out data branch (create it as an orphan if missing)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Token passed per process via GIT_CONFIG_* (never written to disk or the URL).
          basic="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::${basic}"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${basic}"
          git init -q "$DATA_DIR"
          cd "$DATA_DIR"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          # Appends from two runs must never conflict: keep both sides' lines.
          echo "snapshots/*.jsonl merge=union" >> .git/info/attributes
          if git ls-remote --exit-code --heads origin "$DATA_BRANCH" >/dev/null; then
            git fetch -q origin "$DATA_BRANCH"
            git checkout -q -b "$DATA_BRANCH" FETCH_HEAD
          else
            echo "Branch $DATA_BRANCH not found: creating it as an orphan."
            git checkout -q --orphan "$DATA_BRANCH"
          fi

      # Two triggers per hour (this cron at :17 + an external workflow_dispatch at :00): a run
      # within 20 min of the last successful snapshot only rebuilds the page.
      - name: Recent snapshot?
        id: reciente
        run: |
          set -euo pipefail
          python3 - "$DATA_DIR/$SNAPSHOT_FILE" >> "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          from datetime import datetime, timezone
          last = None
          try:
              for line in open(sys.argv[1], encoding="utf-8"):
                  r = json.loads(line) if line.strip() else {}
                  if r.get("payload_json") and not r.get("error"):
                      t = datetime.fromisoformat(r["fetched_at"].replace("Z", "+00:00"))
                      last = t if last is None or t > last else last
          except FileNotFoundError:
              pass
          age = (datetime.now(timezone.utc) - last).total_seconds() if last else None
          print(f"reciente={'true' if age is not None and age < 20 * 60 else 'false'}")
          PY

      - name: Snapshot
        if: steps.reciente.outputs.reciente != 'true'
        run: uv run --frozen corredor snapshot-jama --salida "$DATA_DIR/$SNAPSHOT_FILE"

      - name: Telegram (only on a state change, plus the daily summary)
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PRUEBA: ${{ inputs.prueba && '--prueba' || '--no-prueba' }}
        run: >-
          uv run --frozen corredor jama-telegram --snapshots "$DATA_DIR/$SNAPSHOT_FILE"
          --estado "$DATA_DIR/$TELEGRAM_FILE" "$PRUEBA"

      - name: Commit and push (fetch + rebase, one retry)
        working-directory: ${{ env.DATA_DIR }}
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          basic="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::${basic}"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${basic}"
          git add "$SNAPSHOT_FILE"
          if [ -f "$TELEGRAM_FILE" ]; then git add "$TELEGRAM_FILE"; fi
          if git diff --cached --quiet; then echo "Nada nuevo para guardar."; exit 0; fi
          git commit -q -m "data: Jama snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          sync() {
            if git ls-remote --exit-code --heads origin "$DATA_BRANCH" >/dev/null; then
              git fetch -q origin "$DATA_BRANCH"
              git rebase -q FETCH_HEAD
            fi
          }
          push() { git push -q origin "HEAD:refs/heads/$DATA_BRANCH"; }
          sync
          if ! push; then
            echo "Push rejected; retrying once after fetch + rebase."
            sleep 10
            sync
            push
          fi
          git log -1 --format='%H %an <%ae>'
          tail -n 2 "$SNAPSHOT_FILE"

      - name: Open-Meteo cache (model climatology for the snow flag)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/clima
          key: openmeteo-${{ github.run_id }}
          restore-keys: openmeteo-

      - name: Build "Jama al Día"
        run: >-
          uv run --frozen corredor jama-pagina --snapshots "$DATA_DIR/$SNAPSHOT_FILE"
          --estado "$DATA_DIR/$TELEGRAM_FILE" --salida sitio

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: sitio

  pages:
    needs: snapshot
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
