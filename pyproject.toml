[project]
name = "corredor"
version = "0.1.0.dev0"
description = "Catálogo histórico de cortes y alertas de riesgo para RN 9 y RN 52 (Jujuy)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "httpx>=0.27",
    "pandas>=2.2",
    "pyarrow>=17",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "selectolax>=0.3.21",
    "tenacity>=9.0",
    "typer>=0.12",
]

[project.scripts]
corredor = "corredor.pipeline:app"

[dependency-groups]
dev = [
    "detect-secrets>=1.5",
    "mypy>=1.11",
    "pandas-stubs>=2.2",
    "pip-audit>=2.7",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/corredor"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF", "N", "C4", "PT"]
# Spanish text legitimately uses en/em dashes.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/corredor", "scripts"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=corredor --cov-report=term-missing"
pythonpath = ["scripts"]

[tool.coverage.run]
branch = true
source = ["corredor"]

[tool.coverage.report]
fail_under = 70
exclude_also = [
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]
